<script>
(function() {
  const svg = document.getElementById('mainsvg');
  const NS = 'http://www.w3.org/2000/svg';
  const CX = 960, CY = 540;

  const COLORS_IN  = ['#5f57c4','#7f77dd','#8b83e6','#a09ae8','#c5c2f5'];
  const COLORS_OUT = ['#312e80','#4a44a8','#5f57c4','#7f77dd','#8b83e6'];

  const POOL = 30;
  const particles = [];

  function rand(a, b) { return a + Math.random() * (b - a); }

  function spawnParticle(p) {
    const inbound = Math.random() < 0.55;
    const spawnAngle = rand(0, Math.PI * 2);
    const spawnR = rand(500, 800);
    const sx = CX + Math.cos(spawnAngle) * spawnR;
    const sy = CY + Math.sin(spawnAngle) * spawnR;

    let ex, ey, actualSX = sx, actualSY = sy;
    if (inbound) {
      const endR = rand(0, 50);
      const endAngle = spawnAngle + rand(-0.3, 0.3);
      ex = CX + Math.cos(endAngle) * endR;
      ey = CY + Math.sin(endAngle) * endR;
    } else {
      const startR = rand(0, 50);
      const startAngle = rand(0, Math.PI * 2);
      actualSX = CX + Math.cos(startAngle) * startR;
      actualSY = CY + Math.sin(startAngle) * startR;
      const endAngle = startAngle + rand(-0.25, 0.25);
      const endR = rand(700, 1100);
      ex = CX + Math.cos(endAngle) * endR;
      ey = CY + Math.sin(endAngle) * endR;
    }

    p.x = actualSX; p.y = actualSY;
    p.tx = ex; p.ty = ey;
    p.inbound = inbound;

    const dist = Math.hypot(ex - actualSX, ey - actualSY);
    const speed = inbound ? rand(0.04, 0.10) : rand(0.08, 0.18);
    p.duration = Math.max(4, Math.min(18, dist / (speed * 60)));
    p.elapsed = rand(0, p.duration);
    p.r = inbound ? rand(1.5, 3.0) : rand(1.0, 2.5);
    p.color = inbound
      ? COLORS_IN[Math.floor(Math.random() * COLORS_IN.length)]
      : COLORS_OUT[Math.floor(Math.random() * COLORS_OUT.length)];
    p.maxOpacity = inbound ? rand(0.4, 0.7) : rand(0.25, 0.55);
    p.trailLen = inbound ? rand(0.04, 0.10) : rand(0.06, 0.14);
  }

  function createElem(p) {
    p.el = document.createElementNS(NS, 'circle');
    p.el.setAttribute('r', p.r);
    p.el.setAttribute('fill', p.color);
    p.el.setAttribute('opacity', '0');
    svg.appendChild(p.el);
    p.trail = document.createElementNS(NS, 'circle');
    p.trail.setAttribute('r', p.r * 0.5);
    p.trail.setAttribute('fill', p.color);
    p.trail.setAttribute('opacity', '0');
    svg.appendChild(p.trail);
  }

  for (let i = 0; i < POOL; i++) {
    const p = {};
    spawnParticle(p);
    createElem(p);
    particles.push(p);
  }

  let lastTime = null;
  function tick(ts) {
    if (!lastTime) lastTime = ts;
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;

    for (const p of particles) {
      p.elapsed += dt;
      const t = Math.min(p.elapsed / p.duration, 1.0);
      const cx = p.x + (p.tx - p.x) * t;
      const cy = p.y + (p.ty - p.y) * t;
      const tb = Math.max(0, t - p.trailLen);
      const trx = p.x + (p.tx - p.x) * tb;
      const try_ = p.y + (p.ty - p.y) * tb;

      let op = 0;
      if (t < 0.15) op = (t / 0.15) * p.maxOpacity;
      else if (t < 0.80) op = p.maxOpacity;
      else op = p.maxOpacity * (1 - (t - 0.80) / 0.20);

      p.el.setAttribute('cx', cx.toFixed(1));
      p.el.setAttribute('cy', cy.toFixed(1));
      p.el.setAttribute('opacity', op.toFixed(3));
      p.trail.setAttribute('cx', trx.toFixed(1));
      p.trail.setAttribute('cy', try_.toFixed(1));
      p.trail.setAttribute('opacity', (op * 0.4).toFixed(3));

      if (t >= 1.0) spawnParticle(p);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
